name: Deploy

# Production moves only when Daniel starts this workflow by hand, from `main`: in the Actions tab
# (Deploy, Run workflow) or with `gh workflow run deploy.yml --ref main`. No push, merge or PR
# deploys anything. Vercel's Git integration is switched off for every branch in both projects'
# vercel.json (`git.deploymentEnabled: false`), because each deployment it made, even one its
# Ignored Build Step cancelled, counted against the Hobby plan's daily deployment quota.
#
# The builds still run on Vercel (`vercel deploy`, never `--prebuilt`): a bundle built on this
# Ubuntu runner could carry Python wheels for a newer glibc than Vercel's runtime has, which is how
# every production build failed from June to October 2026.
#
# Each build is staged first as a production deployment that takes no domain (`--prod
# --skip-domain`), proven on its own address, and only then promoted. A plain `vercel deploy` would
# make a Preview deployment, built with Preview's variables, and promoting one rebuilds it, so the
# build checked would not be the build shipped; a `--skip-domain` one is promoted as it was built.
# deploy_proof.py holds every check made after a deploy; docs/RELEASING.md says how it proves itself.
#
# No database backup is taken here. This repository is public, so a dump uploaded as an artifact
# could expose applicants' data; the production cluster's own daily snapshots are the backup.

on:
  workflow_dispatch:

# One production deploy at a time, in order; never cancel one halfway.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # the Test check reads the Test runs

# VERCEL_TOKEN is not here: only the steps that run the Vercel CLI hold it, in their own `env` (the
# two stage steps, the two own-address proofs and the two promotions). The Test check and the two
# domain proofs never hold it.
env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_CLI: vercel@64.5.0

jobs:
  deploy:
    name: deploy
    # Only `main` is production; a run started from any other branch deploys nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://conventioner.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # HAS_VERCEL_TOKEN is `true` or `false`, never the token itself.
      - name: Refuse to run half-configured
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          VERCEL_BACKEND_PROJECT_ID: ${{ vars.VERCEL_BACKEND_PROJECT_ID }}
          VERCEL_FRONTEND_PROJECT_ID: ${{ vars.VERCEL_FRONTEND_PROJECT_ID }}
        run: |
          if [ "$HAS_VERCEL_TOKEN" != true ]; then echo "::error::VERCEL_TOKEN is not set"; exit 1; fi
          if [ -z "$VERCEL_ORG_ID" ]; then echo "::error::VERCEL_ORG_ID is not set"; exit 1; fi
          if [ -z "$VERCEL_BACKEND_PROJECT_ID" ] || [ -z "$VERCEL_FRONTEND_PROJECT_ID" ]; then
            echo "::error::VERCEL_BACKEND_PROJECT_ID and VERCEL_FRONTEND_PROJECT_ID must be set"; exit 1
          fi

      # Before anything is built, so a refusal spends no Vercel deployment.
      - name: Test passed on main at this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/deploy_proof.py green --commit "$GITHUB_SHA"

      # The deploy restores and saves no GitHub Actions cache, so no cached file reaches it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # The CLI prints its logs on stderr and the deployment's own address as its last stdout line.
      # `--env` reaches the back end's runtime, where /healthz reads BUILD_COMMIT.
      - name: Stage the back end
        id: stage-backend
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_BACKEND_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          printed=$(npx --yes "$VERCEL_CLI" deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" --env "BUILD_COMMIT=$GITHUB_SHA")
          url=$(printf '%s\n' "$printed" | tail -n 1)
          if ! [[ "$url" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]]; then
            echo "::error::vercel deploy printed no deployment address"; exit 1
          fi
          echo "Staged at $url"
          echo "url=$url" >>"$GITHUB_OUTPUT"

      - name: The staged back end is this commit
        env:
          STAGED_URL: ${{ steps.stage-backend.outputs.url }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_BACKEND_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 scripts/deploy_proof.py prove --project backend --own --url "$STAGED_URL" --commit "$GITHUB_SHA"

      # `--build-env` reaches the front end's build, where vite.config.ts writes /version.json.
      - name: Stage the front end
        id: stage-frontend
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_FRONTEND_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          printed=$(npx --yes "$VERCEL_CLI" deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" --build-env "BUILD_COMMIT=$GITHUB_SHA")
          url=$(printf '%s\n' "$printed" | tail -n 1)
          if ! [[ "$url" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]]; then
            echo "::error::vercel deploy printed no deployment address"; exit 1
          fi
          echo "Staged at $url"
          echo "url=$url" >>"$GITHUB_OUTPUT"

      - name: The staged front end is this commit
        env:
          STAGED_URL: ${{ steps.stage-frontend.outputs.url }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_FRONTEND_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 scripts/deploy_proof.py prove --project frontend --own --url "$STAGED_URL" --commit "$GITHUB_SHA"

      # The back end first, and seen on its domain before the front end moves: a front end that
      # calls an endpoint the old back end lacks would break every organizer for as long as the two
      # are apart, the reverse breaks nothing.
      - name: Promote the back end
        id: promote-backend
        env:
          STAGED_URL: ${{ steps.stage-backend.outputs.url }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_BACKEND_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "$VERCEL_CLI" promote "$STAGED_URL" --yes --token "$VERCEL_TOKEN"

      - name: api.conventioner.io serves this commit
        run: python3 scripts/deploy_proof.py prove --project backend --domain --url https://api.conventioner.io --commit "$GITHUB_SHA"

      - name: Promote the front end
        id: promote-frontend
        env:
          STAGED_URL: ${{ steps.stage-frontend.outputs.url }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_FRONTEND_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "$VERCEL_CLI" promote "$STAGED_URL" --yes --token "$VERCEL_TOKEN"

      - name: conventioner.io serves this commit
        run: python3 scripts/deploy_proof.py prove --project frontend --domain --url https://conventioner.io --commit "$GITHUB_SHA"

      # Each promote step is `success` (promoted), `skipped` (never tried, so not promoted) or
      # `failure` (tried, result unknown: Vercel can take a promotion and the CLI still exit non-zero
      # once its wait times out). The summary claims only what the run proved.
      - name: Say what production serves
        if: failure()
        env:
          BACKEND_PROMOTION: ${{ steps.promote-backend.outcome }}
          FRONTEND_PROMOTION: ${{ steps.promote-frontend.outcome }}
        run: |
          {
            if [ "$BACKEND_PROMOTION" = failure ]; then
              echo "### Production deploy failed while promoting the back end"
              echo "The promotion of the back end failed partway, so api.conventioner.io may serve this commit or the build before it. The front end was not promoted, so conventioner.io serves the build before this run. The failed step's log says why."
            elif [ "$BACKEND_PROMOTION" != success ]; then
              echo "### Production deploy refused"
              echo "Nothing was promoted: both domains still serve the build they served before this run. The failed step's log says why."
            elif [ "$FRONTEND_PROMOTION" = failure ]; then
              echo "### Production deploy failed while promoting the front end"
              echo "The back end was promoted and api.conventioner.io served this commit. The promotion of the front end failed partway, so conventioner.io may serve this commit or the build before it. The failed step's log says why."
            elif [ "$FRONTEND_PROMOTION" = success ]; then
              echo "### Production deploy failed after promotion"
              echo "Both projects were promoted, but a domain did not report this commit in time or failed a check. Read the failed step's log, then roll back each project if the build is wrong (Vercel, Deployments, Instant Rollback)."
            else
              echo "### Production deploy stopped halfway"
              echo "The back end was promoted and the front end was not, so conventioner.io serves the build before this run; the failed step's log says what api.conventioner.io served last. Fix the cause and run Deploy again, or roll the back end back (Vercel, Deployments, Instant Rollback)."
            fi
            echo "Look at what each domain serves: \`curl https://api.conventioner.io/healthz\` and \`curl https://conventioner.io/version.json\`."
            echo "See docs/RELEASING.md#when-a-deploy-refuses-or-times-out."
          } >>"$GITHUB_STEP_SUMMARY"
