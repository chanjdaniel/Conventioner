name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-floorplan-solver.txt -r requirements-dev.txt
      # Re-lock with the pinned uv (the dev lock installs it); a lock edited by hand, or an .in
      # changed without re-locking, comes out different.
      - name: The locks are what the lock command writes
        run: |
          ../scripts/lock-backend-requirements.sh
          git diff --exit-code -- 'requirements*.txt' || {
            echo "::error::A back-end lock differs from what scripts/lock-backend-requirements.sh writes; run it and commit the result"
            exit 1
          }
      - run: python -m pytest tests/ -v

  # The docs are a graph of nodes that describe the code (scripts/knowledge_graph.py). This job
  # checks the graph itself and is a required check on dev.
  knowledge-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r back-end/requirements-dev.txt
      - name: Checker tests
        run: python -m pytest scripts/tests -q
      - name: Check the graph
        run: python scripts/knowledge_graph.py check

  # Drift - a PR that changes described code without touching the node that describes it - needs
  # the base branch's history, hence the full clone. A job of its own so it is not required: for
  # the next 10 PRs from 2026-10-22 a finding shows red without blocking the merge, then it is
  # re-judged.
  knowledge-graph-drift:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Drift against the base branch
        run: python scripts/knowledge_graph.py drift --base origin/${{ github.base_ref }}

  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  frontend-lint-and-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Lint (full repo)
        run: npm run lint
      # Warnings today, not errors: the design language landed against 1150 existing violations
      # (E16/F02). A rule that fails the build on a pre-existing backlog gets disabled within a
      # week, which is the outcome this gate exists to avoid. The four slice features flip it to
      # errors one directory at a time as each slice lands.
      - name: Lint styles against the design language
        run: npm run lint:css
      - name: Type-check (full repo)
        run: npm run type-check

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build

  # Split by spec file across four runners, each with its own Docker stack, so a hotfix waits
  # for a quarter of the suite rather than all of it (it took 11-16 minutes on one runner). The
  # tests share one database WITHIN a runner (`workers: 1`), never across runners.
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      DISABLE_CAPTCHA: "true"
      DISABLE_EMAIL: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      # Install front-end deps on the host BEFORE `docker compose up`. Otherwise
      # Docker (as root) creates the anonymous-volume mountpoint `front-end/node_modules`
      # on the host bind mount root-owned, and the later `npm ci` fails with EACCES.
      - name: Install front-end dependencies
        working-directory: front-end
        run: npm ci
      - name: Install Playwright browsers
        working-directory: front-end
        run: npx playwright install chromium --with-deps
      - run: docker compose build
      # Docker Hub's transient 500 on `mongo:7` or `mongo-express:latest` once failed one shard
      # of four outright. Retry only that pull, so a stack that genuinely fails to start fails
      # the shard at once.
      - name: Pull the stack's registry images
        run: |
          for attempt in 1 2 3 4 5 6; do
            docker compose pull mongodb mongo-express && exit 0
            echo "docker compose pull failed (attempt $attempt of 6); retrying" >&2
            sleep 10
          done
          exit 1
      - run: docker compose up -d
      - run: ./scripts/seed_fixture.sh
      - name: Run Playwright tests
        working-directory: front-end
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Report flaky tests
        if: always()
        working-directory: front-end
        run: |
          if [ -f test-results/results.json ]; then
            FLAKY=$(jq -r '.stats.flaky // 0' test-results/results.json)
            PASSED=$(jq -r '.stats.expected // 0' test-results/results.json)
            FAILED=$(jq -r '.stats.unexpected // 0' test-results/results.json)
            {
              echo "### E2E Test Results (shard ${{ matrix.shard }}/4)"
              echo "| Outcome | Count |"
              echo "|---------|-------|"
              echo "| Passed  | $PASSED |"
              echo "| Failed  | $FAILED |"
              echo "| Flaky   | $FLAKY |"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$FLAKY" -gt 0 ]; then
              {
                echo ""
                echo ':warning: **'"$FLAKY"' test(s) passed only after retry.**'
                echo "These tests failed on their first attempt and recovered on a retry —"
                echo "a genuine intermittent failure, not a clean pass. Each flaky test is"
                echo "listed with its error in the Playwright run output above."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Docker compose logs
        if: always()
        run: docker compose logs
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            front-end/playwright-report/
            front-end/test-results/
          retention-days: 7

  # The one check to require: it passes only when every shard did, so branch protection names a
  # single job whatever the shard count becomes.
  e2e:
    if: always()
    needs: e2e-shard
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.e2e-shard.result }}" = "success"
