name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# A push to a pull request's branch makes the run of its earlier head moot, so that run is
# cancelled. A push to dev or main never cancels one: each commit there keeps the checks a
# promotion reads, so its group is its own commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The one place zizmor's version and checksum live, for both zizmor jobs: a bump moves them together.
# actionlint's sit beside them, so a bump of either is one place too.
env:
  ZIZMOR_VERSION: 1.31.1
  ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

# Each job's `name:` is its check's name, which branch protection requires a check by: renaming a
# required job drops its check from the required list.
jobs:
  backend:
    name: backend
    # Pinned to ubuntu-24.04: mongod 8.0 refuses to start on Linux kernel 6.19 and newer (MongoDB SERVER-121912), which ubuntu-latest (ubuntu-26.04) runs.
    # Remove this pin and return to ubuntu-latest once MongoDB 8.0 has a fix for kernel 6.19+.
    runs-on: ubuntu-24.04
    # The real-MongoDB tests (back-end/tests/real_mongo/) run on this server, the major version
    # production runs. REAL_MONGODB_REQUIRED makes each of them fail, not skip, when the server's
    # URI is missing, so this job can never skip them in silence.
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27117:27017
        # The open-file limit is the compose file's, which says why.
        options: >-
          --ulimit nofile=64000:64000
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REAL_MONGODB_URI: mongodb://127.0.0.1:27117/?serverSelectionTimeoutMS=5000
      REAL_MONGODB_REQUIRED: "true"
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-floorplan-solver.txt -r requirements-dev.txt
      # Re-lock with the pinned uv (the dev lock installs it); a lock edited by hand, or an .in
      # changed without re-locking, comes out different.
      - name: The locks are what the lock command writes
        run: |
          ../scripts/lock-backend-requirements.sh
          git diff --exit-code -- 'requirements*.txt' || {
            echo "::error::A back-end lock differs from what scripts/lock-backend-requirements.sh writes; run it and commit the result"
            exit 1
          }
      - run: python -m pytest tests/ -v

  # The docs are a graph of nodes that describe the code (scripts/knowledge_graph.py). This job
  # checks the graph itself and is a required check on dev.
  knowledge-graph:
    name: knowledge-graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The pre-warm's tests run the machine's own npm, so they run the pinned one here too.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pip install -r back-end/requirements-dev.txt
      - name: Checker tests
        run: python -m pytest scripts/tests -q
      - name: Check the graph
        run: python scripts/knowledge_graph.py check

  # Drift - a PR that changes described code without touching the node that describes it - needs
  # the base branch's history, hence the full clone. A job of its own so it is not required: for
  # the next 10 PRs from 2026-10-22 a finding shows red without blocking the merge, then it is
  # re-judged.
  knowledge-graph-drift:
    name: knowledge-graph-drift
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Drift against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/knowledge_graph.py drift --base "origin/$BASE_REF"

  # A backstop, not the protection: the repository is public, so a pushed branch is published
  # before any job runs. The protection is the same checker in the git hooks and the gate, before
  # anything leaves the PC (docs/implementation/conventions/security-invariants.md). This job only
  # keeps a PR that got past them from merging.
  real-data:
    name: real-data
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: No real data in the PR's commits
        run: python scripts/real_data_check.py commits "$HEAD_SHA" --not "origin/$BASE_REF"
      - name: No real data anywhere in the tree
        run: python scripts/real_data_check.py tree
      - name: No secret in the PR's commits (gitleaks)
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --verbose --log-opts="origin/$BASE_REF..$HEAD_SHA" .

  # The repository's workflows and Dependabot config, offline, so it needs no token. Every finding
  # fails the job; an accepted one is ignored on the line zizmor reports, with its audit and the
  # reason after it.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor ${{ env.ZIZMOR_VERSION }}
        run: |
          archive=zizmor-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLO "https://github.com/zizmorcore/zizmor/releases/download/v$ZIZMOR_VERSION/$archive"
          echo "$ZIZMOR_SHA256  $archive" | sha256sum -c -
          mkdir zizmor-bin
          tar -xzf "$archive" -C zizmor-bin zizmor
          echo "$PWD/zizmor-bin" >>"$GITHUB_PATH"
      - run: zizmor --offline .

  # Information, not a required check: zizmor's online audits (an impostor commit, a known-vulnerable
  # action or a confused ref behind a pin) look each action up through GitHub's API, so a rate
  # limit or an outage there must not block a merge. Pull requests only, with the run's read-only
  # token.
  zizmor-online:
    name: zizmor-online
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor ${{ env.ZIZMOR_VERSION }}
        run: |
          archive=zizmor-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLO "https://github.com/zizmorcore/zizmor/releases/download/v$ZIZMOR_VERSION/$archive"
          echo "$ZIZMOR_SHA256  $archive" | sha256sum -c -
          mkdir zizmor-bin
          tar -xzf "$archive" -C zizmor-bin zizmor
          echo "$PWD/zizmor-bin" >>"$GITHUB_PATH"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .

  # The workflows' syntax, expressions, job references and action inputs, and each `run:` script
  # through the shellcheck the runner has: what zizmor, which audits for security, does not read.
  # Every finding fails the job.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint ${{ env.ACTIONLINT_VERSION }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          mkdir actionlint-bin
          tar -xzf "$archive" -C actionlint-bin actionlint
          echo "$PWD/actionlint-bin" >>"$GITHUB_PATH"
      - run: actionlint .github/workflows/*.yml

  frontend-unit:
    name: frontend-unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  frontend-lint-and-types:
    name: frontend-lint-and-types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      # The Node is the one .nvmrc pins, the npm the one it bundles (`--engine-strict` refuses any
      # other than package.json's `engines`), and the lockfile what that npm writes, so a real
      # dependency change writes the same lockfile on every machine; another npm rewrites fields.
      - name: Install with the pinned Node and npm
        run: |
          test "$(node --version)" = "v$(cat ../.nvmrc)"
          npm ci --engine-strict
      - name: The pinned npm writes the committed lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code package-lock.json
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Lint (full repo)
        run: npm run lint
      # Refuses errors and warnings alike (T221): a warning this step let pass reached dev, and
      # then landed on whichever later change touched the file.
      - name: Lint styles against the design language
        run: npm run lint:css
      - name: Type-check (full repo)
        run: npm run type-check
      # The JavaScript a first visit loads before any page paints stays under a gzipped limit,
      # printed every run; scripts/bundle-budget.ts holds the limit and says how to raise it on
      # purpose. This bundle is measured, never deployed, so it is built without a captcha site key.
      # The build fails if any module of the development-only component library (src/dev/) is in
      # it (vite.config.ts, noDevModules).
      - name: Build
        env:
          VITE_ALLOW_INSECURE_LOCAL_DEV: "true"
        run: npm run build-only
      - name: Bundle budget
        run: npm run bundle-budget
      # The Content-Security-Policy has no 'unsafe-eval': no built file calls eval or Function
      # (scripts/no-eval.ts).
      - name: No string evaluated as script
        run: npm run no-eval

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose build

  # Split by spec file across six runners, each with its own Docker stack, so a PR waits for a
  # sixth of the suite rather than all of it (83 runner-minutes of tests on 2026-11-08, about
  # 4.5 more per runner to set up). The tests share one database WITHIN a runner (`workers: 1`),
  # never across runners. `front-end/scripts/e2e-shards.ts` deals the spec files to the shards by
  # the minutes in `e2e-shard-timings.json`, not Playwright's `--shard`, which cuts the
  # alphabetical list by test count and once left one shard at 24 minutes and another at 6.
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/6
    # Pinned to ubuntu-24.04: mongod 8.0 refuses to start on Linux kernel 6.19 and newer (MongoDB SERVER-121912), which ubuntu-latest (ubuntu-26.04) runs.
    # Remove this pin and return to ubuntu-latest once MongoDB 8.0 has a fix for kernel 6.19+.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      DISABLE_CAPTCHA: "true"
      DISABLE_EMAIL: "true"
      DISCORD_FAKE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      # Install front-end deps on the host BEFORE `docker compose up`. Otherwise
      # Docker (as root) creates the anonymous-volume mountpoint `front-end/node_modules`
      # on the host bind mount root-owned, and the later `npm ci` fails with EACCES.
      - name: Install front-end dependencies
        working-directory: front-end
        run: npm ci
      - name: Install Playwright browsers
        working-directory: front-end
        run: npx playwright install chromium --with-deps
      - run: docker compose build
      # A transient Docker Hub 500 on one of the stack's registry images once failed one shard
      # outright. Retry only that pull, so a stack that genuinely fails to start fails the shard
      # at once.
      - name: Pull the stack's registry images
        run: |
          for attempt in 1 2 3 4 5 6; do
            docker compose pull mongodb mongo-express && exit 0
            echo "docker compose pull failed (attempt $attempt of 6); retrying" >&2
            sleep 10
          done
          exit 1
      - run: docker compose up -d
      - run: ./scripts/seed_fixture.sh --primary
      - name: Run Playwright tests
        working-directory: front-end
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/e2e-shards.ts "--shard=$SHARD/6"
      - name: Report flaky tests
        if: always()
        working-directory: front-end
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -f test-results/results.json ]; then
            FLAKY=$(jq -r '.stats.flaky // 0' test-results/results.json)
            PASSED=$(jq -r '.stats.expected // 0' test-results/results.json)
            FAILED=$(jq -r '.stats.unexpected // 0' test-results/results.json)
            {
              echo "### E2E Test Results (shard $SHARD/6)"
              echo "| Outcome | Count |"
              echo "|---------|-------|"
              echo "| Passed  | $PASSED |"
              echo "| Failed  | $FAILED |"
              echo "| Flaky   | $FLAKY |"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$FLAKY" -gt 0 ]; then
              {
                echo ""
                echo ':warning: **'"$FLAKY"' test(s) passed only after retry.**'
                echo "These tests failed on their first attempt and recovered on a retry -"
                echo "a genuine intermittent failure, not a clean pass. Each flaky test is"
                echo "listed with its error in the Playwright run output above."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Docker compose logs
        if: always()
        run: docker compose logs
      # The report that refreshes `e2e-shard-timings.json` (`node scripts/e2e-shards.ts refresh`).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: front-end/test-results/results.json
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            front-end/playwright-report/
            front-end/test-results/
          retention-days: 7

  # The one check to require: it passes only when every shard did, so branch protection names a
  # single job whatever the shard count becomes. It runs whatever the shards' result, so a failed
  # shard fails it, but not on a run that was cancelled, which would post a red check on the head
  # a later push made moot.
  e2e:
    name: e2e
    if: ${{ !cancelled() }}
    needs: e2e-shard
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
        run: test "$SHARDS_RESULT" = "success"
