# Dependabot's version updates, and the titles of its security updates too.
# Options: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# Its PRs target the default branch, dev, and skip the no-mistakes gate: CI's required checks are
# their gate (docs/implementation/testing/ci-and-the-gate.md#dependabot).
# No pip entry: the back end's locks are written by uv through scripts/lock-backend-requirements.sh,
# with hashes, and Dependabot is not known to write them as that script does; bump them by hand.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/front-end"
    schedule:
      interval: "weekly"
    # Titles are Conventional Commits release-please reads: fix(deps): for what ships, so it cuts a
    # patch; chore(deps-dev): for tooling, so it cuts nothing.
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    # A week's minor and patch bumps arrive as one PR per dependency type, so CI runs once for each
    # and a tooling bump never shares a fix(deps): title. A major bump comes on its own.
    groups:
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # Held 2026-10-24: TypeScript 7.0 ships no JavaScript API, so vue-tsc (`type-check`) and
      # typescript-eslint (`lint`) cannot run on it; Microsoft's 7.0 announcement tells Vue projects
      # to stay on 6.0 (https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/).
      # Retry once TypeScript 7.1 ships its API and both support it:
      # typescript-eslint/typescript-eslint#10940, vuejs/language-tools#5381 and #6167.
      # 6.0 still arrives as its own PR.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # Held 2026-10-26: @types/node describes one Node major, and .nvmrc pins Node 24, which every
      # machine, CI and the front-end image run. Types for a later Node would let a config file or an
      # E2E spec call an API that Node 24 lacks and still pass `type-check`. Not an upstream issue:
      # move this major together with the Node pin (docs/TECH_STACK.md#node-and-npm-are-pinned).
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # ci(deps): an action bump changes CI, not the product, so release-please cuts nothing.
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        update-types: ["minor", "patch"]
