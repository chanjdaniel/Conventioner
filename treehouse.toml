# treehouse config for Conventioner - pooled, pre-warmed worktrees for agents.
# See scripts/README-treehouse.md for the full workflow.
#
# QUICK START (agents):
#   path=$(scripts/th-lease.sh <agent-label>)   # isolated, pre-warmed worktree
#   cd "$path" && <work>                          # .env + node_modules ready
#   scripts/th-compose.sh up -d                   # (optional) isolated back-end stack
#   scripts/th-return.sh "$path"                  # release; tears down the stack
#
# NOTE: do NOT call `treehouse get` directly for automation - treehouse v3 runs
# hooks only from the user's ~/.config/treehouse/config.toml, never from this
# file, so a raw worktree is missing .env/node_modules.
# The th-lease.sh wrapper leases AND pre-warms in one step.

# Pool size: a ceiling that only stops a runaway, not the bound in use.
# The agent team's resource level bounds the worktrees (its room check before a
# task opens, and its admission of each launch), well below this number.
# treehouse cannot be uncapped: it refuses every lease at 0 or a negative value,
# and caps an omitted key at 16.
max_trees = 100

# Empty => worktrees live under $HOME/.treehouse/.
root = ""
