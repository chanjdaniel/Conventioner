# Per-worktree isolation overlay for treehouse worktrees.
#
# Applied ON TOP of a worktree's own docker-compose.yml so multiple worktrees
# can run the stack in parallel without colliding. It gives each worktree:
#   - a unique COMPOSE_PROJECT_NAME (isolates containers, networks, volumes)
#   - unique container_names
#   - offset host ports, or ports Docker picks (TH_PORTS=auto), on 127.0.0.1 only
#   - the team's ownership labels, on every container, named volume and network
#   - no restart by itself, and no bind mount that creates its missing source
#   - memory, CPU and process limits per service
#   - the back end's and front end's images shared with every stack of the same
#     dependencies, never pulled
#   - mongo-express only when asked for (`th-compose.sh --profile tools up -d`)
#   - email off unless the caller turns it on
#
# Driven exclusively by scripts/th-compose.sh, which exports COMPOSE_PROJECT_NAME,
# the TH_*_PORT variables and the TH_*_TAG image tags. Do not use this file directly - the variables have
# no defaults on purpose, so a bare `docker compose -f ... -f this` would error.
#
# `!override` (Compose 2.24+) REPLACES the base list instead of appending to
# it, so the base's fixed host ports and short-syntax mounts don't leak through.
#
# Why a stack never restarts and never creates a bind source: on 2026-10-22 two
# aborted gate runs left their stacks restart-looping after the gate deleted their
# worktrees, and each restart re-created the missing mount sources as root, which
# blocked every later gate run until they were removed with sudo. Now a stack
# whose worktree is gone fails to start instead.
#
# The limits are service-level keys, which plain `docker compose up` honours
# (`deploy.resources` is for Swarm). Each sits well above the service's peak in
# a full gate run, as measured in docs/TESTING.md ("Stack limits"); a limit
# within 20% of a measured peak is raised.
#
# The back end's and front end's images are named by a hash of the files each is
# built from (scripts/image-tags.sh), not by the project, so every slot stack and
# gate run with the same dependencies shares one image, and the source reaches
# the containers through the bind mounts. `pull_policy: never` builds a missing
# image from the worktree instead of pulling it: conventioner/* on Docker Hub is
# not ours.

# The ownership contract: who started the stack, for which task, of which kind,
# from which worktree, and when the reaper may remove it. Each is empty when its
# variable is unset, which marks the stack as not the team's.
x-team-labels: &team-labels
  io.github.chanjdaniel.team.owner: ${TEAM_OWNER:-}
  io.github.chanjdaniel.team.task: ${TEAM_TASK:-}
  io.github.chanjdaniel.team.kind: ${TEAM_KIND:-}
  io.github.chanjdaniel.team.worktree: ${TEAM_WORKTREE:-}
  io.github.chanjdaniel.team.expires: ${TEAM_EXPIRES:-}

services:
  mongodb:
    container_name: ${COMPOSE_PROJECT_NAME}-mongodb
    restart: "no"
    labels: *team-labels
    ports: !override
      - "127.0.0.1:${TH_MONGO_PORT}:27017"
    mem_limit: 1g
    cpus: 2
    pids_limit: 512
    # The base flags, plus a cache sized for the limit: by default WiredTiger
    # takes half of the host's memory, not of the container's.
    command: !override ["mongod", "--quiet", "--logpath", "/var/log/mongodb/mongod.log", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: !override
      - mongodb_data:/data/db
      - type: bind
        source: ./back-end/mongo-init.js
        target: /docker-entrypoint-initdb.d/mongo-init.js
        read_only: true
        bind:
          create_host_path: false

  backend:
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    image: conventioner/backend:${TH_BACKEND_TAG}
    pull_policy: never
    restart: "no"
    labels: *team-labels
    ports: !override
      - "127.0.0.1:${TH_BACKEND_PORT}:5000"
    mem_limit: 768m
    cpus: 1
    pids_limit: 256
    environment:
      # An agent stack has no Resend key, so it sends no email unless asked to.
      - DISABLE_EMAIL=${DISABLE_EMAIL:-true}
    volumes: !override
      - type: bind
        source: ./back-end
        target: /app
        bind:
          create_host_path: false
      - backend_sessions:/app/flask_session

  frontend:
    container_name: ${COMPOSE_PROJECT_NAME}-frontend
    image: conventioner/frontend:${TH_FRONTEND_TAG}
    pull_policy: never
    restart: "no"
    labels: *team-labels
    ports: !override
      - "127.0.0.1:${TH_FRONTEND_PORT}:5173"
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    volumes: !override
      - type: bind
        source: ./front-end
        target: /app
        bind:
          create_host_path: false
      - /app/node_modules

  mongo-express:
    container_name: ${COMPOSE_PROJECT_NAME}-mongo-express
    restart: "no"
    labels: *team-labels
    # A database browser for a person, so it starts only with `--profile tools`.
    # Without TH_MONGO_EXPRESS_PORT, Docker picks a free host port.
    profiles: [tools]
    ports: !override
      - "127.0.0.1:${TH_MONGO_EXPRESS_PORT:-}:8081"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

networks:
  conventioner_network:
    labels: *team-labels

volumes:
  mongodb_data:
    labels: *team-labels
  backend_sessions:
    labels: *team-labels
